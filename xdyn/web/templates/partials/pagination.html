{% if total_pages > 1 %}
<nav class="pagination" aria-label="分页">
    {% if prev_url %}<a class="page-link" href="{{ prev_url }}">上一页</a>{% endif %}
    {% for number, url, active in page_links %}
    <a class="page-link {% if active %}active{% endif %}" href="{{ url }}">{{ number }}</a>
    {% endfor %}
    {% if next_url %}<a class="page-link" href="{{ next_url }}">下一页</a>{% endif %}
    <span class="page-info">第 {{ page }} / {{ total_pages }} 页</span>
</nav>
{% endif %}
