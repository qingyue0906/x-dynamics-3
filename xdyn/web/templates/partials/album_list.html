{% for item in album_items %}
<div class="album-item">
    {% if item.ok %}
    <button class="media-cell" type="button"
            data-full="{{ url_for('media', media_id=item.id) }}"
            {% if item.is_video %}data-video="1" data-poster="{{ url_for('thumb', media_id=item.id, w=900) if item.poster_url else '' }}"{% endif %}
            data-author="{{ item.display_name or '' }}"
            data-time="{{ item.time_str }}"
            data-tweet="{{ item.x_url }}"
            title="{{ '播放视频' if item.is_video else '查看大图' }}">
        {% if item.is_video %}
            <img class="video-poster" src="{{ url_for('thumb', media_id=item.id) }}" alt="" loading="lazy" decoding="async">
            <span class="media-badge">{{ 'GIF' if item.media_type == 'animated_gif' else '视频' }}</span>
        {% else %}
            <img src="{{ url_for('thumb', media_id=item.id) }}" alt="" loading="lazy" decoding="async">
        {% endif %}
    </button>
    {% else %}
    <div class="media-cell is-missing"><span>{{ item.status_label }}</span></div>
    {% endif %}
    <div class="album-meta">
        <span>{{ item.display_name or item.owner_name }}</span>
        <span>{{ item.time_str }}</span>
    </div>
</div>
{% endfor %}
