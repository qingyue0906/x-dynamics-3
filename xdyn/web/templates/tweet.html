{% extends "base.html" %}
{% block content %}
<section class="page-head">
    <div>
        <h1>指定推文</h1>
        <p class="sub">支持 x.com、twitter.com、vxtwitter.com 的推文链接或纯推文 ID；先预览，再下载。</p>
    </div>
</section>

<section class="panel dynamic-panel">
    <form class="dynamic-form" id="tweetForm">
        <input type="text" class="input" id="tweetInput" placeholder="https://x.com/user/status/1234567890123456789 或纯 ID" autocomplete="off">
        <button class="btn-primary" type="button" id="previewTweet">预览</button>
        <button class="btn-ghost" type="button" id="downloadTweet" disabled>下载媒体</button>
        <label class="check"><input type="checkbox" id="addTweetUser"> 同时加入用户列表并启用同步</label>
    </form>
    <p class="form-hint" id="tweetHint">预览不会写库；下载后媒体会写入作者目录，文字推文也会保存。</p>

    <div class="dynamic-preview" id="tweetPreview" hidden>
        <div class="dynamic-preview-head">
            <span class="avatar" id="tweetAvatar"></span>
            <div>
                <strong id="tweetAuthor"></strong>
                <div class="sub" id="tweetMeta"></div>
            </div>
            <a class="bili-link" id="tweetLink" href="#" target="_blank" rel="noopener">原推 ↗</a>
        </div>
        <p class="prose" id="tweetText"></p>
        <div class="post-quote" id="tweetQuote" hidden></div>
        <div class="dynamic-thumbs" id="tweetThumbs"></div>
    </div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/tweet.js') }}" defer></script>{% endblock %}
